spring:
  security:
    jwt:
      secret-key: ${SPRING_SECURITY_JWT_SECRET_KEY}
      expiration: ${SPRING_SECURITY_JWT_EXPIRATION}
      refresh:
        expiration: ${SPRING_SECURITY_JWT_REFRESH_EXPIRATION}

  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_DB_USERNAME}
    password: ${SPRING_DATASOURCE_DB_PASSWORD}
    url: ${SPRING_DATASOURCE_DB_URL}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  config:
    import: optional:file:.env[.properties]

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_PROPERTIES_SMTP_AUTH}
          starttls:
            enable: ${MAIL_PROPERTIES_SMTP_AUTH_STARTTLS}


app:
  verification:
    base-url: ${APP_VERIFICATION_BASE_URL}
  password-reset:
    ui-base-url: ${APP_PASSWORD_RESET_UI_BASE_URL}
  mail:
    type: ${APP_MAIL_TYPE}