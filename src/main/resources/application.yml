spring:
  security:
    jwt:
      secret-key: ${SPRING_SECURITY_JWT_SECRET_KEY}
      expiration: ${SPRING_SECURITY_JWT_EXPIRATION}
      refresh:
        expiration: ${SPRING_SECURITY_JWT_REFRESH_EXPIRATION}

  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_DB_USERNAME}
    password: ${SPRING_DATASOURCE_DB_PASSWORD}
    url: ${SPRING_DATASOURCE_DB_URL}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  config:
    import: optional:file:.env[.properties]

app:
  verification:
    base-url: ${APP_VERIFICATION_BASE_URL:http://localhost:8080/api/auth/verify-email}